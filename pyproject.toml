[project]
name = "gda-oversquashing"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch_geometric>=2.6",
  "numpy",
  "scipy",
  "networkx",
  "matplotlib",
  "pandas",
  "pyyaml",
  "tqdm",
]

[project.optional-dependencies]
cpu = ["torch>=2.8"]
cu126 = ["torch>=2.8"]
cu128 = ["torch>=2.8,<2.12"]  # PyTorch stopped publishing cu128 wheels after 2.11
cu130 = ["torch>=2.11"]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
conflicts = [[
  { extra = "cpu" },
  { extra = "cu126" },
  { extra = "cu128" },
  { extra = "cu130" },
]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
